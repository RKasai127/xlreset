[project]
name = "xlreset"
version = "0.1.0"
description = "CLI to reset an Excel workbook's initial view to cell A1 and 100% zoom on every sheet."
readme = "README.md"
license = "MIT"
authors = [
    { name = "RyoKasai", email = "sekaowa.ryoukun@icloud.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RKasai127/xlreset"
Issues = "https://github.com/RKasai127/xlreset/issues"

[project.scripts]
xlreset = "xlreset.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["test_cli", "test_workbook", "test_xml_rewrite", "conftest"]
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
